<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Village</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2c3038; --text: #e7e9ee; --muted: #9aa1ad;
    --accent: #f2b84b; --bad: #e0675b; --good: #6fbf73;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  #clock { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0; height: calc(100vh - 104px); }
  #mapwrap { position: relative; overflow: auto; padding: 12px; min-width: 0; }
  canvas { display: block; image-rendering: pixelated; border-radius: 6px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 8px; }
  .being { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .being.sel { border-color: var(--accent); }
  .being .top { display: flex; justify-content: space-between; gap: 8px; }
  .being .name { font-weight: 600; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .bars { display: grid; grid-template-columns: 52px 1fr; gap: 2px 8px; font-size: 12px; color: var(--muted); margin: 6px 0; }
  .bar { height: 6px; background: #2a2e36; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; }
  .small { font-size: 12px; color: var(--muted); }
  .thought { font-style: italic; color: #c9cdd6; font-size: 12.5px; margin-top: 4px; white-space: pre-wrap; }
  .ev { font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .ev.fail { color: var(--muted); }
  .ev b { color: var(--accent); font-weight: 600; }
  footer { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); height: 52px; }
  footer input[type=range] { flex: 1; accent-color: var(--accent); }
  button { background: #2a2e36; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
  select { background: #2a2e36; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
  #tip { position: fixed; pointer-events: none; background: #0d0f12ee; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: 280px; display: none; z-index: 5; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; height: auto; padding-bottom: 60px; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); z-index: 4; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); height: auto; }
    header { padding: 10px 12px; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>AI Village</h1>
  <span id="clock">connecting…</span>
  <span class="small" id="mode"></span>
</header>
<main>
  <div id="mapwrap"><canvas id="map"></canvas></div>
  <aside>
    <h2>Beings</h2>
    <div id="beings"></div>
    <h2 id="selhead" style="display:none">Notes</h2>
    <div id="notes" class="small"></div>
    <h2>This turn</h2>
    <div id="events"></div>
    <h2>Built so far</h2>
    <div id="built" class="small"></div>
  </aside>
</main>
<footer>
  <button id="play" title="Play / pause the replay">▶</button>
  <button id="live" class="on" title="Follow the newest turn">Live</button>
  <input id="slider" type="range" min="0" max="0" value="0">
  <span id="pos" class="small">0 / 0</span>
  <select id="speed" title="Replay speed">
    <option value="1000">1×</option><option value="400" selected>2.5×</option>
    <option value="150">6×</option><option value="50">20×</option>
  </select>
</footer>
<div id="tip"></div>

<script>
const COLORS = { ".": "#4f7d3a", "T": "#2c5a2a", "^": "#7b7b80", "~": "#2f5f8f", "*": "#4f7d3a" };
const STRUCT = {
  wall: ["#8d8d93", "#"], path: ["#b7a37a", ""], house: ["#b5651d", "H"], farm: ["#a68b3c", "F"],
  chest: ["#8a5a2b", "C"], campfire: ["#e2662c", "&"], bridge: ["#9c7a4c", ""], sign: ["#d9c48b", "!"], other: ["#9b6bd6", "?"],
};
const AGENT_COLORS = ["#f2b84b", "#5bc0eb", "#e86a92", "#9bc53d", "#c38dff", "#ff8c42", "#4ce0b3", "#f25f5c", "#ffe066", "#70a1ff"];
const $ = id => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
let frames = 0, current = -1, live = true, playing = false, timer = null, selected = null, frame = null, isLive = false;
const cache = new Map();
// Exported pages (python -m village export) carry their frames inline instead of a server.
const STATIC = window.VILLAGE_FRAMES || null;

async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
async function getFrame(n) {
  if (STATIC) return STATIC[n < 0 ? STATIC.length - 1 : Math.min(n, STATIC.length - 1)];
  if (cache.has(n)) return cache.get(n);
  const f = await getJSON(`/api/frame/${n}`);
  if (cache.size > 400) cache.delete(cache.keys().next().value);
  cache.set(n, f);
  return f;
}

function tileSize(f) {
  const wrap = $("mapwrap");
  const narrow = window.innerWidth <= 860;
  const byWidth = (wrap.clientWidth - 24) / f.width;
  const s = Math.floor(narrow ? byWidth : Math.min(byWidth, (Math.max(320, wrap.clientHeight) - 24) / f.height));
  return Math.max(6, Math.min(28, s));
}

function draw(f) {
  const S = tileSize(f);
  canvas.width = f.width * S; canvas.height = f.height * S;
  for (let y = 0; y < f.height; y++) {
    const row = f.terrain[y];
    for (let x = 0; x < f.width; x++) {
      const c = row[x];
      ctx.fillStyle = COLORS[c] || "#333";
      ctx.fillRect(x * S, y * S, S, S);
      if (c === "T") { ctx.fillStyle = "#1e4220"; ctx.beginPath(); ctx.arc(x*S+S/2, y*S+S/2, S*0.32, 0, 7); ctx.fill(); }
      if (c === "^") { ctx.fillStyle = "#9a9aa0"; ctx.beginPath(); ctx.moveTo(x*S+S*0.2, y*S+S*0.8); ctx.lineTo(x*S+S/2, y*S+S*0.2); ctx.lineTo(x*S+S*0.8, y*S+S*0.8); ctx.fill(); }
      if (c === "*") { ctx.fillStyle = "#d6336c"; for (const [dx, dy] of [[.35,.4],[.62,.55],[.45,.68]]) { ctx.beginPath(); ctx.arc(x*S+dx*S, y*S+dy*S, S*0.09, 0, 7); ctx.fill(); } }
    }
  }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const s of f.structures) {
    const [col, glyph] = STRUCT[s.kind] || ["#fff", "?"];
    const pad = s.kind === "path" || s.kind === "bridge" ? 0 : S * 0.1;
    ctx.fillStyle = col; ctx.fillRect(s.x*S+pad, s.y*S+pad, S-2*pad, S-2*pad);
    if (glyph) { ctx.fillStyle = "#1a1a1a"; ctx.font = `bold ${Math.floor(S*0.6)}px system-ui`; ctx.fillText(glyph, s.x*S+S/2, s.y*S+S/2+1); }
  }
  if (f.night) { ctx.fillStyle = "rgba(10, 15, 40, 0.38)"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  for (const a of f.agents) {
    const col = AGENT_COLORS[(a.id - 1) % AGENT_COLORS.length];
    const cx = a.x*S+S/2, cy = a.y*S+S/2;
    if (selected === a.id) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, S*0.62, 0, 7); ctx.stroke(); }
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, S*0.42, 0, 7); ctx.fill();
    ctx.fillStyle = "#111"; ctx.font = `bold ${Math.floor(S*0.5)}px system-ui`; ctx.fillText(a.id % 10, cx, cy+1);
    ctx.font = `600 ${Math.max(10, Math.floor(S*0.45))}px system-ui`;
    const label = a.name.startsWith("unnamed") ? `#${a.id}` : a.name;
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.strokeText(label, cx, cy - S*0.8);
    ctx.fillStyle = "#fff"; ctx.fillText(label, cx, cy - S*0.8);
  }
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bar = (v, col) => `<div class="bar"><i style="width:${Math.max(0, Math.min(100, v))}%;background:${col}"></i></div>`;

function panel(f) {
  $("clock").textContent = `Day ${f.day}, ${f.time} · turn ${f.tick}`;
  $("beings").innerHTML = f.agents.map(a => {
    const col = AGENT_COLORS[(a.id - 1) % AGENT_COLORS.length];
    const inv = Object.entries(a.inventory).map(([k, v]) => `${k} ${v}`).join(", ") || "nothing";
    return `<div class="being ${selected === a.id ? "sel" : ""}" data-id="${a.id}">
      <div class="top"><span class="name"><span class="dot" style="background:${col}"></span>${esc(a.name)}</span><span class="small">(${a.x}, ${a.y})</span></div>
      <div class="bars"><span>fullness</span>${bar(a.satiety, a.satiety < 25 ? "var(--bad)" : "var(--good)")}<span>energy</span>${bar(a.energy, a.energy < 25 ? "var(--bad)" : "#5bc0eb")}</div>
      <div class="small">${esc(a.action || "…")} · carrying ${esc(inv)}</div>
      ${a.thought ? `<div class="thought">“${esc(a.thought)}”</div>` : ""}
    </div>`;
  }).join("");
  document.querySelectorAll(".being").forEach(el => el.onclick = () => {
    selected = selected === +el.dataset.id ? null : +el.dataset.id; render();
  });
  const sel = f.agents.find(a => a.id === selected);
  $("selhead").style.display = sel ? "" : "none";
  $("selhead").textContent = sel ? `${sel.name}'s notes` : "";
  $("notes").innerHTML = sel ? (sel.notes.length ? sel.notes.map((n, i) => `${i + 1}. ${esc(n)}`).join("<br>") : "No notes yet.") : "";
  $("events").innerHTML = (f.events || []).map(e =>
    `<div class="ev ${e.ok ? "" : "fail"}"><b>${esc(e.who)}</b> ${esc(e.result)}</div>`).join("") || `<div class="small">Nothing yet.</div>`;
  const counts = {};
  for (const s of f.structures) counts[s.kind] = (counts[s.kind] || 0) + 1;
  const named = f.structures.filter(s => s.name || s.kind === "sign" || s.kind === "other");
  $("built").innerHTML = (Object.entries(counts).map(([k, v]) => `${k} × ${v}`).join(" · ") || "Nothing built yet.") +
    named.slice(-15).map(s => `<div class="ev">${esc(s.name || s.kind)} at (${s.x}, ${s.y}) by ${esc(s.builder)}${s.text ? `: “${esc(s.text)}”` : s.description ? ` — ${esc(s.description)}` : ""}</div>`).join("");
}

function render() { if (frame) { draw(frame); panel(frame); } }

async function show(n) {
  try {
    frame = await getFrame(n);
    current = n;
    $("slider").value = n;
    $("pos").textContent = `${n + 1} / ${frames}`;
    render();
  } catch (e) { /* not ready yet */ }
}

async function poll() {
  try {
    const info = STATIC ? { frames: STATIC.length, live: false } : await getJSON("/api/info");
    isLive = info.live;
    $("mode").textContent = isLive ? "live" : "replay";
    $("live").style.display = isLive ? "" : "none";
    frames = info.frames;
    $("slider").max = Math.max(0, frames - 1);
    $("pos").textContent = `${Math.max(0, current) + 1} / ${frames}`;
    if (live && isLive && frames && current !== frames - 1) await show(frames - 1);
    if (!frames && !frame && isLive) { frame = await getJSON("/api/frame/-1"); render(); }
    if (!isLive && current < 0 && frames) { live = false; $("live").classList.remove("on"); await show(0); }
  } catch (e) { $("clock").textContent = "disconnected"; }
}

function setLive(on) { live = on; $("live").classList.toggle("on", on); if (on) { stop(); poll(); } }
function stop() { playing = false; clearTimeout(timer); $("play").textContent = "▶"; }
function tick() {
  if (!playing) return;
  if (current < frames - 1) { show(current + 1).then(() => { timer = setTimeout(tick, +$("speed").value); }); }
  else stop();
}
$("play").onclick = () => {
  if (playing) return stop();
  setLive(false);
  if (current >= frames - 1) current = -1;
  playing = true; $("play").textContent = "❚❚"; tick();
};
$("live").onclick = () => setLive(!live);
$("slider").oninput = e => { setLive(false); stop(); show(+e.target.value); };
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" && current > 0) { setLive(false); stop(); show(current - 1); }
  if (e.key === "ArrowRight" && current < frames - 1) { setLive(false); stop(); show(current + 1); }
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
});
window.addEventListener("resize", render);

canvas.addEventListener("mousemove", e => {
  if (!frame) return;
  const S = canvas.width / frame.width, r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / S), y = Math.floor((e.clientY - r.top) / S);
  const bits = [];
  for (const a of frame.agents) if (a.x === x && a.y === y) bits.push(`<b>${esc(a.name)}</b>: ${esc(a.action)}`);
  for (const s of frame.structures) if (s.x === x && s.y === y) {
    bits.push(`<b>${esc(s.name || s.kind)}</b> (${s.kind}) by ${esc(s.builder)}, turn ${s.built_tick}`);
    if (s.description) bits.push(esc(s.description));
    if (s.text) bits.push(`“${esc(s.text)}”`);
    const st = Object.entries(s.storage || {}).filter(([, v]) => v).map(([k, v]) => `${k} ${v}`).join(", ");
    if (s.kind === "chest") bits.push(`contains: ${st || "nothing"}`);
  }
  const tip = $("tip");
  if (!bits.length) { tip.style.display = "none"; return; }
  tip.innerHTML = `<div class="small">(${x}, ${y})</div>` + bits.join("<br>");
  tip.style.display = "block"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
canvas.addEventListener("mouseleave", () => $("tip").style.display = "none");
// Taps on phones show the same details as hovering.
canvas.addEventListener("click", e => canvas.dispatchEvent(new MouseEvent("mousemove", { clientX: e.clientX, clientY: e.clientY })));

poll();
setInterval(poll, 700);
</script>
</body>
</html>
